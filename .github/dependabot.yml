version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Shanghai"
    # Wait a week before proposing a freshly published release: this is the
    # standard mitigation against compromised-package supply-chain attacks.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@tailwindcss/*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:10"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
